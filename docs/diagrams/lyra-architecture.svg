<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Lyra XML architecture</title>
  <desc id="desc">XML fragments and view models connect repositories to Firebase and Media3 ExoPlayer.</desc>
  <rect width="1200" height="650" fill="#0d1117"/>
  <g font-family="Arial, sans-serif" fill="#f0f6fc">
    <text x="60" y="70" font-size="30" font-weight="700">Lyra Architecture</text>
    <g stroke="#58a6ff" stroke-width="3" fill="#161b22">
      <rect x="60" y="220" width="220" height="120" rx="18"/><rect x="350" y="220" width="220" height="120" rx="18"/>
      <rect x="640" y="220" width="220" height="120" rx="18"/><rect x="930" y="220" width="210" height="120" rx="18"/>
    </g>
    <g text-anchor="middle" font-size="22">
      <text x="170" y="270">XML UI</text><text x="170" y="305" font-size="17">Activity • Fragments</text>
      <text x="460" y="270">ViewModel</text><text x="460" y="305" font-size="17">LiveData + actions</text>
      <text x="750" y="270">Repository</text><text x="750" y="305" font-size="17">Models + mappers</text>
      <text x="1035" y="270">Firebase</text><text x="1035" y="305" font-size="17">Firestore</text>
    </g>
    <g stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"><path d="M280 280h70"/><path d="M570 280h70"/><path d="M860 280h70"/></g>
    <rect x="410" y="440" width="380" height="100" rx="18" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <text x="600" y="485" text-anchor="middle" font-size="22">Media3 ExoPlayer</text><text x="600" y="515" text-anchor="middle" font-size="17">AudioPlayerManager • audioUrl</text>
    <path d="M460 340v55h140v45M640 340v55h-40" fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#58a6ff"/></marker></defs>
</svg>
