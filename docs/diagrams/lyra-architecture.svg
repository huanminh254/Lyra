<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Lyra architecture relationship diagram</title>
  <desc id="desc">User interface connects to ViewModels, repositories, Firebase and Media3 ExoPlayer.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/></marker></defs>
  <rect width="1200" height="650" fill="#0d1117"/>
  <text x="50" y="58" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="30" font-weight="700">Lyra — sơ đồ quan hệ</text>
  <g fill="#161b22" stroke="#30363d" stroke-width="2">
    <rect x="50" y="255" width="170" height="75" rx="14" fill="#1f6feb"/>
    <rect x="285" y="220" width="220" height="145" rx="14"/>
    <rect x="570" y="220" width="220" height="145" rx="14"/>
    <rect x="855" y="120" width="250" height="110" rx="14"/>
    <rect x="855" y="290" width="250" height="110" rx="14"/>
    <rect x="855" y="460" width="250" height="110" rx="14"/>
  </g>
  <g fill="#f0f6fc" font-family="Arial,sans-serif" text-anchor="middle">
    <text x="135" y="285" font-size="20" font-weight="700">Người nghe</text><text x="135" y="310" font-size="15">tương tác ứng dụng</text>
    <text x="395" y="260" font-size="20" font-weight="700">Compose UI</text><text x="395" y="288" font-size="15">Discover • Search</text><text x="395" y="312" font-size="15">Now Playing • Settings</text><text x="395" y="336" font-size="15">Favorites • Downloads</text>
    <text x="680" y="260" font-size="20" font-weight="700">ViewModel</text><text x="680" y="288" font-size="15">screen state</text><text x="680" y="312" font-size="15">user actions</text><text x="680" y="336" font-size="15">navigation</text>
    <text x="980" y="158" font-size="20" font-weight="700">Repository</text><text x="980" y="185" font-size="15">Song / User</text><text x="980" y="207" font-size="15">Remote data source</text>
    <text x="980" y="328" font-size="20" font-weight="700">Firebase</text><text x="980" y="355" font-size="15">Firestore • Storage</text><text x="980" y="377" font-size="15">songs / users</text>
    <text x="980" y="498" font-size="20" font-weight="700">Media3 ExoPlayer</text><text x="980" y="526" font-size="15">audioUrl • buffering</text><text x="980" y="548" font-size="15">play / seek / next</text>
  </g>
  <g stroke="#58a6ff" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M220 292 L285 292"/><path d="M505 292 L570 292"/><path d="M790 260 L855 190"/><path d="M980 230 L980 290"/><path d="M790 330 L855 500"/><path d="M980 460 L980 400"/></g>
  <g fill="#8b949e" font-family="Arial,sans-serif" font-size="14"><text x="240" y="280">event</text><text x="520" y="280">state</text><text x="808" y="220">query</text><text x="1000" y="265">read</text><text x="810" y="425">playback</text></g>
</svg>
